<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>html{background:#1a1614}</style>
  <script>!function(){var t=sessionStorage.getItem('txText'),c=sessionStorage.getItem('txColor');if(t){document.documentElement.classList.add('skip-preloader');var d=document.createElement('div');d.id='txInitCover';d.style.cssText='position:fixed;inset:0;z-index:9890;background:'+(c||'#1a1614')+';pointer-events:none;';document.documentElement.appendChild(d);}}();</script>
  <title>Dev Chauhan — Portfolio</title>
  <meta name="description" content="Creative portfolio — brand identity, visual design and digital art. Explore projects, artworks and more.">
  <link rel="canonical" href="/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=8">
  <link rel="stylesheet" href="assets/css/nav.css?v=8">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <style>
    body.page-index .skip-to-content { background: #1d4ed8; }
    body.page-index :focus-visible { outline-color: #1d4ed8; box-shadow: 0 0 0 4px rgba(239,68,68,0.75); }
  </style>
</head>
<body class="page-index">
  <a href="#mainContent" class="skip-to-content">Skip to content</a>

  <!-- ══════════ PRELOADER (TV LOADER) ══════════ -->
  <div class="preloader" id="preloader" aria-hidden="true" role="presentation">
    <div class="tv-outer">
      <div class="tv-screen">
        <div class="tv-inner" id="tvInner">
          <div class="tv-bars" aria-hidden="true">
            <div class="tv-bar tv-bar--w"></div>
            <div class="tv-bar tv-bar--y"></div>
            <div class="tv-bar tv-bar--c"></div>
            <div class="tv-bar tv-bar--g"></div>
            <div class="tv-bar tv-bar--m"></div>
            <div class="tv-bar tv-bar--r"></div>
            <div class="tv-bar tv-bar--b"></div>
          </div>
          <div class="tv-bars-bottom" aria-hidden="true">
            <div class="tv-bar-b tv-bar-b--1"></div>
            <div class="tv-bar-b tv-bar-b--2"></div>
            <div class="tv-bar-b tv-bar-b--3"></div>
            <div class="tv-bar-b tv-bar-b--4"></div>
            <div class="tv-bar-b tv-bar-b--5"></div>
            <div class="tv-bar-b tv-bar-b--6"></div>
            <div class="tv-bar-b tv-bar-b--7"></div>
          </div>
          <div class="tv-barcode tv-barcode--left" aria-hidden="true"></div>
          <div class="tv-barcode tv-barcode--right" aria-hidden="true"></div>
          <div class="tv-chaos" id="tvChaos" aria-hidden="true"></div>
          <div class="tv-center">
            <div class="tv-panel">
              <div class="tv-msg">STREAM<br>STARTING<br>SOON</div>
              <div class="tv-panel-bar">
                <div class="tv-progress">
                  <div class="tv-progress-fill" id="tvProgressFill"></div>
                </div>
                <span class="tv-pct" id="tvPct">0%</span>
              </div>
              <div class="tv-skip-hint" id="tvSkipHint" aria-hidden="true">
                <span class="tv-skip-desktop">PRESS SPACE OR ESC TO SKIP</span>
                <span class="tv-skip-mobile">TAP TO SKIP</span>
              </div>
            </div>
          </div>
        </div>
        <div class="tv-bios" id="tvBios"></div>
        <div class="tv-scanlines" aria-hidden="true"></div>
        <canvas class="tv-grain-canvas" id="tvGrainCanvas" aria-hidden="true"></canvas>
        <canvas class="tv-glitch-canvas" id="tvGlitchCanvas" aria-hidden="true"></canvas>
        <div class="tv-scanner-lines" aria-hidden="true">
          <span style="--dur:9s;--del:0s"></span>
          <span style="--dur:13s;--del:-5s"></span>
          <span style="--dur:17s;--del:-10s"></span>
        </div>
        <div class="tv-inner-glow" aria-hidden="true"></div>
        <div class="tv-vignette" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- ══════════ BACKGROUND ══════════ -->
  <div class="bg-layer" aria-hidden="true">
    <canvas class="bg-canvas" id="bgCanvas"></canvas>
    <canvas class="fluid-canvas" id="fluidCanvas"></canvas>
    <div class="bg-noise"></div>
  </div>

  <!-- ══════════ SIDE RAILS ══════════ -->
  <nav aria-label="Site navigation">
    <a href="projects.html" class="side side--left" id="sideLeft" aria-label="Projects">
      <span class="side-text"><span class="side-arrow">&larr;</span> PROJECTS</span>
      <span class="side-nr">01</span>
    </a>
    <a href="artworks.html" class="side side--right" id="sideRight" aria-label="Artworks">
      <span class="side-nr">02</span>
      <span class="side-text">ARTWORKS <span class="side-arrow">&rarr;</span></span>
    </a>
  </nav>

  <!-- ══════════ PORTRAIT + NAME ══════════ -->
  <main id="mainContent">
    <h1 class="sr-only">Dev Chauhan — Designer &amp; Portfolio</h1>
    <div class="slide-group" id="slideGroup" aria-hidden="true">
      <div class="portrait-section" id="portraitSection">
        <div class="portrait-frame" id="portraitFrame">
          <img
            class="portrait-base"
            id="portraitBase"
            src="assets/images/portrait.webp?v=3"
            alt="Dev Chauhan, designer"
            draggable="false"
            width="968"
            height="1300"
            fetchpriority="high"
          >
          <img
            class="portrait-illustration"
            id="portraitIllustration"
            src="assets/images/portrait-illustration.webp?v=3"
            alt=""
            draggable="false"
            width="968"
            height="1300"
          >
          <canvas class="illustration-canvas" id="illustrationCanvas"></canvas>
        </div>
      </div>
      <div class="name-section" id="nameSection" aria-label="EVREN / GALEKTO">
        <div class="name-display" id="nameDisplay"></div>
      </div>
    </div>
  </main>

  <!-- ══════════ MENU DOTS ══════════ -->
  <button class="menu-dots" id="menuDots" aria-label="Menu" tabindex="-1"></button>

  <!-- ══════════ CUSTOM CURSOR ══════════ -->
  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>
  <script>!function(){var mx=parseFloat(sessionStorage.getItem('mx')||''),my=parseFloat(sessionStorage.getItem('my')||'');var x=isNaN(mx)?-200:mx,y=isNaN(my)?-200:my;var d=document.getElementById('cursorDot'),r=document.getElementById('cursorRing');if(d){d.style.left=x+'px';d.style.top=y+'px';}if(r){r.style.left=x+'px';r.style.top=y+'px';}}();</script>

  <!-- ══════════ PAGE TRANSITION OVERLAY (legacy) ══════════ -->
  <div id="pageOverlay"><span class="overlay-label" id="overlayLabel"></span></div>

  <!-- ══════════ PAGE TV OVERLAY ══════════ -->
  <div class="page-tv-overlay" aria-hidden="true">
    <div class="page-scanlines"></div>
    <canvas class="page-grain-canvas" id="pageGrainCanvas"></canvas>
    <div class="page-scanner-lines">
      <span style="--dur:10s;--op:0.10"></span>
      <span style="--dur:13s;--op:0.07"></span>
      <span style="--dur:17s;--op:0.04"></span>
    </div>
    <div class="page-inner-glow"></div>
    <div class="page-vignette"></div>
  </div>

  <!-- ══════════ CRT BEVEL / FRAME / STROKE ══════════ -->
  <div class="page-crt-bevel" aria-hidden="true"></div>
  <div class="page-tv-frame" aria-hidden="true"></div>
  <svg class="page-tv-stroke" aria-hidden="true"></svg>
  <script>
    (function () {
      var W = window.innerWidth, H = window.innerHeight, m = W <= 768;
      var MC = m ? 12 : 38, MM = m ? 4 : 8;
      var R = m ? Math.min(Math.max(18, W * .03), 28) : Math.min(Math.max(40, W * .042), 70);
      var i = 'M ' + (MC + R) + ',' + MC +
        ' Q ' + (W / 2) + ',' + MM + ' ' + (W - MC - R) + ',' + MC +
        ' Q ' + (W - MC) + ',' + MC + ' ' + (W - MC) + ',' + (MC + R) +
        ' Q ' + (W - MM) + ',' + (H / 2) + ' ' + (W - MC) + ',' + (H - MC - R) +
        ' Q ' + (W - MC) + ',' + (H - MC) + ' ' + (W - MC - R) + ',' + (H - MC) +
        ' Q ' + (W / 2) + ',' + (H - MM) + ' ' + (MC + R) + ',' + (H - MC) +
        ' Q ' + MC + ',' + (H - MC) + ' ' + MC + ',' + (H - MC - R) +
        ' Q ' + MM + ',' + (H / 2) + ' ' + MC + ',' + (MC + R) +
        ' Q ' + MC + ',' + MC + ' ' + (MC + R) + ',' + MC + ' Z';
      var o = 'M 0,0 L ' + W + ',0 L ' + W + ',' + H + ' L 0,' + H + ' Z';
      var f = document.querySelector('.page-tv-frame');
      var b = document.querySelector('.page-crt-bevel');
      var sv = document.querySelector('.page-tv-stroke');
      if (f) { f.style.clipPath = "path(evenodd, '" + o + ' ' + i + "')"; f.style.visibility = 'visible'; }
      if (b) b.style.clipPath = "path('" + i + "')";
      if (sv) {
        sv.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        sv.style.clipPath = "path('" + i + "')";
        var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', i);
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke', 'rgba(30,28,26,0.10)');
        p.setAttribute('stroke-width', '6');
        sv.appendChild(p);
      }
    })();
  </script>

  <!-- Fluid quality tiers for narrow viewports -->
  <script>
    (function () {
      var w = window.innerWidth;
      if (w < 1200) {
        window.FluidSimOverride = {
          CURL:               w < 600 ? 8  : w < 900 ? 12 : 16,
          SPLAT_RADIUS:       w < 600 ? 0.18 : w < 900 ? 0.20 : 0.22,
          SIM_RESOLUTION:     w < 600 ? 64 : w < 900 ? 96 : 128,
          PRESSURE_ITERATIONS: w < 600 ? 8 : w < 900 ? 12 : 16
        };
      }
    })();
  </script>

  <script src="assets/js/transition.js?v=8" defer></script>
  <script src="assets/js/fluid.js?v=8" defer></script>
  <script src="assets/js/content-client.js?v=10" defer></script>
  <script src="assets/js/main.js?v=10" defer></script>
  <script src="assets/js/nav.js?v=9" defer></script>
  <script src="assets/js/tv-overlay.js?v=8" defer></script>
</body>
</html>
