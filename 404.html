<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>html{background:#1a1614}</style>
  <title>404 — Signal Lost</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <style>
    body.page-404 {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; height: 100vh; background: #060606; overflow: hidden;
    }
    .err-code {
      font-family: var(--font-name); font-weight: 900;
      font-size: clamp(90px, 22vw, 320px); line-height: 0.85;
      color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, 0.16);
    }
    .err-msg {
      font-family: var(--font-term); font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 0.10em; color: #ffb000; text-align: center;
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0.35; } }
    .err-home {
      font-family: var(--font-ui); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 13px 26px; text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .err-home:hover { background: #fff; color: #000; }
  </style>
</head>
<body class="page-404">
  <div class="err-code">404</div>
  <div class="err-msg">CHANNEL NOT FOUND — PLEASE RETUNE</div>
  <a class="err-home" href="index.html">&larr; Back to Broadcast</a>
</body>
</html>
